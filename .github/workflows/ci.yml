name: Test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Test with a real Tk display on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest --cov=basemark --cov-report=xml
      - name: Test on Windows / macOS
        if: runner.os != 'Linux'
        run: uv run pytest --cov=basemark --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
