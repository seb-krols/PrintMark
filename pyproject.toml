[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "basemark"
version = "0.6.0"
description = "Material and part-ID stamps for PrusaSlicer, built for print labs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Sebastians Krols"}]
dependencies = [
    "shapely>=2.1,<3",
    "fonttools>=4.59,<5",
    "tomli-w>=1.2,<2",
    "filelock>=3.19,<4",
    "pillow>=11,<13",  # anti-aliased placement preview
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "pyinstaller>=6.15,<7"]

[project.scripts]
basemark = "basemark.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/basemark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
